name: Publicar dashboard no GitHub Pages

# Publica a dashboard de observabilidade em
# https://michelmelog.github.io/Compiladores/
#
# A publicação é um BUILD DE DEMONSTRAÇÃO: o GitHub Pages serve apenas
# arquivos estáticos, e a dashboard consome um backend REST que ainda não
# existe. Por isso o build define VITE_DEMO=true, que embute um conjunto
# de dados fictícios e exibe um aviso permanente no topo da página.
# Ver dashboard/BACKEND_INTEGRATION.md.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já estiver em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run lint

      - name: Build de demonstração
        run: npm run build
        env:
          # GitHub Pages de projeto serve em /<nome-do-repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO: 'true'
          VITE_API_URL: /api

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o Pages automaticamente caso ainda não esteja ativo.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
